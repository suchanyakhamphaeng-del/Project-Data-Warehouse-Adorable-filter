version: 2

models:
  - name: dim_customers
    description: "Customer dimension table"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_city
        data_tests:
          - not_null

  - name: dim_products
    description: "Product dimension with category and supplier details"
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: category_id
        data_tests:
          - not_null
      - name: supplier_id
        data_tests:
          - not_null

  - name: dim_promotions
    description: "Promotion dimension table with discount percentage"
    columns:
      - name: promotion_id
        data_tests:
          - unique
          - not_null
      - name: discount_pct
        data_tests:
          - not_null

  - name: dim_stores
    description: "Store dimension table with city and employee stats"
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
      - name: store_city
        data_tests:
          - not_null

  - name: dim_date
    description: "Calendar date dimension table"
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: fct_store_city_summary
    description: "Summary of stores per city"
    columns:
      - name: city
        data_tests:
          - unique
          - not_null
      - name: store_count
        data_tests:
          - not_null

  - name: fact_sales
    description: "Sales fact table at the order item grain (1 row per order item)"
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_stores')
              field: store_id
      - name: promotion_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_promotions')
              field: promotion_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: qty
        data_tests:
          - not_null
      - name: unit_price
        data_tests:
          - not_null
      - name: subtotal_amount
        data_tests:
          - not_null
