version: 2

models:
  - name: stg_orders
    description: "One row per order"
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_customers'), field: customer_id}
      - name: store_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_stores'), field: store_id}
      - name: promotion_id
        description: "Nullable: orders without a promotion"
        data_tests:
          - relationships: {to: ref('stg_promotions'), field: promotion_id}

  - name: stg_order_items
    description: "One row per order line"
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_orders'), field: order_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_products'), field: product_id}

  - name: stg_payments
    description: "One row per payment"
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_orders'), field: order_id}

  - name: stg_shipments
    description: "One row per shipment"
    columns:
      - name: shipment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_orders'), field: order_id}
      - name: shipment_status
        data_tests:
          - accepted_values:
              values: ['delivered', 'late', 'shipped']

  - name: stg_returns
    description: "One row per returned order item"
    columns:
      - name: return_id
        data_tests: [unique, not_null]
      - name: order_item_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_order_items'), field: order_item_id}

  - name: stg_customers
    description: "One row per customer"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_products
    description: "One row per product"
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_categories'), field: category_id}
      - name: supplier_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_suppliers'), field: supplier_id}

  - name: stg_employees
    description: "One row per employee (contains salary, so sensitive)"
    columns:
      - name: employee_id
        data_tests: [unique, not_null]
      - name: store_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_stores'), field: store_id}

  - name: stg_stores
    columns:
      - name: store_id
        data_tests: [unique, not_null]

  - name: stg_promotions
    columns:
      - name: promotion_id
        data_tests: [unique, not_null]

  - name: stg_categories
    columns:
      - name: category_id
        data_tests: [unique, not_null]

  - name: stg_suppliers
    description: "One row per supplier"
    columns:
      - name: supplier_id
        data_tests: [unique, not_null]