version: 2

seeds:
  - name: promotions
    description: "Promotion discount percentages lookup"
    config:
      column_types:
        promotion_id: integer
        discount: integer
    columns:
      - name: promotion_id
        description: "Primary key for promotions"
        data_tests:
          - unique
          - not_null
      - name: discount
        description: "Percentage discount (0-100)"
        data_tests:
          - not_null

  - name: stores
    description: "Store location cities lookup"
    config:
      column_types:
        store_id: integer
        city: varchar(100)
    columns:
      - name: store_id
        description: "Primary key for stores"
        data_tests:
          - unique
          - not_null
      - name: city
        description: "City where the store is located"
        data_tests:
          - not_null

  - name: categories
    description: "Product category lookup"
    config:
      column_types:
        category_id: integer
        category_name: varchar(100)
    columns:
      - name: category_id
        description: "Primary key for categories"
        data_tests:
          - unique
          - not_null
      - name: category_name
        description: "Category display name"
        data_tests:
          - not_null

  - name: suppliers
    description: "Supplier country lookup"
    config:
      column_types:
        supplier_id: integer
        country: varchar(100)
    columns:
      - name: supplier_id
        description: "Primary key for suppliers"
        data_tests:
          - unique
          - not_null
      - name: country
        description: "Country where the supplier is based"
        data_tests:
          - not_null